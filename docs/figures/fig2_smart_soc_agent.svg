<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1960" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1a1a1a; }
      .legend { font-size: 13px; fill: #1a1a1a; }
      .secTitle { font-size: 19px; font-weight: 700; fill: #1a1a1a; }
      .secSub { font-size: 12.5px; font-style: italic; fill: #555; }
      .inner { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
      .detail { font-size: 12px; fill: #333; }
      .detailC { font-size: 12px; fill: #333; text-anchor: middle; }
      .blueTitle { font-size: 19px; font-weight: 700; fill: #2b6cb0; }
      .blueSub { font-size: 12.5px; font-style: italic; fill: #2b6cb0; }
      .flow { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
      .darkTitle { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .darkSub { font-size: 12.5px; font-style: italic; fill: #d9d9d9; }
      .mapTxt { font-size: 12.5px; fill: #333; }
      .sideLabel { font-size: 13px; font-weight: 600; fill: #2b6cb0; }
    </style>
  </defs>

  <text x="720" y="40" text-anchor="middle" class="title">Smart SOC Agent: Evidence-Gated Investigation on ExCyTIn-Bench</text>

  <!-- Legend -->
  <rect x="60" y="60" width="1320" height="40" fill="none" stroke="#888" stroke-width="1"/>
  <rect x="80" y="72" width="16" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="104" y="85" class="legend">① Agent</text>
  <rect x="190" y="72" width="16" height="16" fill="#ececec" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="214" y="85" class="legend">② Environment</text>
  <rect x="340" y="72" width="16" height="16" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="364" y="85" class="legend">③ Data source</text>
  <line x1="500" y1="80" x2="545" y2="80" stroke="#1a1a1a" stroke-width="2"/>
  <text x="553" y="85" class="legend">Control</text>
  <line x1="630" y1="80" x2="675" y2="80" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="683" y="85" class="legend">Context</text>
  <rect x="760" y="72" width="16" height="16" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="784" y="85" class="legend" fill="#2b6cb0">Proposed smart agent (this work)</text>

  <!-- ① Agent box -->
  <rect x="60" y="130" width="340" height="330" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="230" y="164" text-anchor="middle" class="secTitle">① Smart SOC Agent</text>
  <text x="230" y="184" text-anchor="middle" class="secSub">(policy under evaluation)</text>
  <text x="230" y="222" text-anchor="middle" class="inner">Benchmark actions</text>
  <text x="230" y="246" text-anchor="middle" class="detailC">execute[&lt;SQL&gt;] · submit[&lt;answer&gt;]</text>
  <text x="230" y="266" text-anchor="middle" class="detailC">one thought–action pair per step</text>
  <line x1="100" y1="290" x2="360" y2="290" stroke="#bbb" stroke-width="1"/>
  <text x="230" y="320" text-anchor="middle" class="detailC" fill="#2b6cb0" font-style="italic">▼ implemented by</text>
  <text x="230" y="340" text-anchor="middle" class="detailC" fill="#2b6cb0" font-style="italic">proposed evidence-gated pipeline</text>
  <text x="230" y="360" text-anchor="middle" class="detailC" fill="#2b6cb0" font-style="italic">↓ see below</text>
  <text x="230" y="400" text-anchor="middle" class="detailC">drop-in replacement for the</text>
  <text x="230" y="418" text-anchor="middle" class="detailC">ReAct BaselineAgent interface</text>
  <text x="230" y="436" text-anchor="middle" class="detailC">act(obs) → (action, submit)</text>

  <!-- ② Env core -->
  <rect x="460" y="130" width="520" height="330" rx="10" fill="#ececec" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="720" y="164" text-anchor="middle" class="secTitle">② ExCyTIn-Env Core</text>
  <text x="720" y="184" text-anchor="middle" class="secSub">(deterministic benchmark environment)</text>

  <rect x="490" y="200" width="460" height="70" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="224" text-anchor="middle" class="inner">2.1 MySQL log store</text>
  <text x="720" y="244" text-anchor="middle" class="detailC">20+ tables per incident: alerts · sign-ins · office · device · email</text>
  <text x="720" y="260" text-anchor="middle" class="detailC">raw SQL executed verbatim · results stringified &amp; truncated</text>

  <rect x="490" y="280" width="460" height="70" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="304" text-anchor="middle" class="inner">2.2 Question set</text>
  <text x="720" y="324" text-anchor="middle" class="detailC">QA pairs generated from incident alert–entity graphs</text>
  <text x="720" y="340" text-anchor="middle" class="detailC">question = initial observation · gold answer hidden</text>

  <rect x="490" y="360" width="460" height="70" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="384" text-anchor="middle" class="inner">2.3 LLM evaluator scoring</text>
  <text x="720" y="404" text-anchor="middle" class="detailC">judge compares submitted answer vs gold · reward ∈ [0, 1]</text>
  <text x="720" y="420" text-anchor="middle" class="detailC">reward only at submit · step budget 15–25</text>

  <!-- ③ Incident corpus -->
  <rect x="1040" y="130" width="340" height="330" rx="10" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="1210" y="164" text-anchor="middle" class="secTitle">③ Incident Corpus</text>
  <text x="1210" y="184" text-anchor="middle" class="secSub">(real tenant attack data)</text>
  <text x="1210" y="226" text-anchor="middle" class="detailC">8 multistage attacks</text>
  <text x="1210" y="246" text-anchor="middle" class="detailC">raw logs → alerts → security incident</text>
  <line x1="1080" y1="270" x2="1340" y2="270" stroke="#999" stroke-width="1"/>
  <text x="1210" y="300" text-anchor="middle" class="detailC">Graph Builder: incident + alerts</text>
  <text x="1210" y="320" text-anchor="middle" class="detailC">→ bipartite alert–entity graph</text>
  <text x="1210" y="352" text-anchor="middle" class="detailC">QA Generator: questions from</text>
  <text x="1210" y="372" text-anchor="middle" class="detailC">start/end node pairs on paths</text>
  <text x="1210" y="412" text-anchor="middle" class="detailC" font-style="italic">untrusted content: log text may</text>
  <text x="1210" y="430" text-anchor="middle" class="detailC" font-style="italic">carry adversarial instructions</text>

  <!-- arrows top row -->
  <line x1="400" y1="230" x2="460" y2="230" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="430" y="216" text-anchor="middle" class="flow">Actions</text>
  <line x1="460" y1="330" x2="400" y2="330" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="430" y="352" text-anchor="middle" class="flow">Obs.</text>
  <line x1="1040" y1="280" x2="980" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
  <text x="1012" y="266" text-anchor="middle" class="flow">Ctx.</text>

  <!-- reward dashed -->
  <path d="M 720 460 L 720 500 L 230 500 L 230 460" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow2)"/>
  <text x="470" y="492" text-anchor="middle" class="flow">Reward (at submit)</text>

  <!-- ④ protocol strip -->
  <rect x="60" y="530" width="1320" height="56" rx="8" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="8 5"/>
  <text x="720" y="554" text-anchor="middle" class="inner">④ Benchmark protocol</text>
  <text x="720" y="574" text-anchor="middle" class="detailC">per-question episodes · deterministic database · max 15–25 steps · temperature 0 · scored by LLM judge (GPT-4o)</text>

  <!-- divider -->
  <line x1="60" y1="630" x2="1380" y2="630" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="720" y="662" text-anchor="middle" class="blueTitle">Proposed Smart Agent Pipeline (implements ① Smart SOC Agent)</text>
  <text x="720" y="682" text-anchor="middle" class="blueSub">same 7-node architecture as the OpenSec soc_defender — only the action interface and the gated commitment change</text>

  <!-- side loop label -->
  <path d="M 46 720 L 46 1660" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="1190" class="sideLabel" transform="rotate(-90 36 1190)" text-anchor="middle">one benchmark action per step → loops until submit gate opens</text>

  <!-- A. Scanner -->
  <rect x="80" y="710" width="1280" height="190" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="720" y="740" text-anchor="middle" class="blueTitle" font-size="17">A. Injection &amp; Trust Scanner</text>
  <text x="720" y="760" text-anchor="middle" class="blueSub">retrieved log rows are untrusted content · annotate before they reach any LLM prompt</text>

  <rect x="240" y="780" width="440" height="94" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="460" y="806" text-anchor="middle" class="inner">Layer 1: Regex classifier</text>
  <text x="460" y="828" text-anchor="middle" class="detailC">YAML rule families · instruction-override, role-play,</text>
  <text x="460" y="844" text-anchor="middle" class="detailC">prompt-extraction patterns · flagged ≥ 0.85 · suspicious ≥ 0.60</text>
  <text x="460" y="860" text-anchor="middle" class="detailC">reused unchanged from soc_defender</text>

  <rect x="760" y="780" width="440" height="94" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="980" y="806" text-anchor="middle" class="inner">Layer 2: Span localization</text>
  <text x="980" y="828" text-anchor="middle" class="detailC">mark suspicious spans inside rows;</text>
  <text x="980" y="844" text-anchor="middle" class="detailC">entities appearing ONLY in flagged spans</text>
  <text x="980" y="860" text-anchor="middle" class="detailC">never satisfy the answer gate (C)</text>

  <line x1="720" y1="900" x2="720" y2="940" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- B. Investigator + state -->
  <rect x="80" y="944" width="1280" height="360" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="720" y="974" text-anchor="middle" class="blueTitle" font-size="17">B. Investigator + Episode State</text>
  <text x="720" y="994" text-anchor="middle" class="blueSub">deterministic state backbone (DefenderPolicy analogue) · LLM proposes, never executes</text>

  <rect x="110" y="1014" width="380" height="120" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="1040" text-anchor="middle" class="inner">Schema Cache (persistent)</text>
  <text x="300" y="1062" text-anchor="middle" class="detailC">tables · columns · sample rows, learned once</text>
  <text x="300" y="1078" text-anchor="middle" class="detailC">per incident, reused across all questions</text>
  <text x="300" y="1094" text-anchor="middle" class="detailC">replaces 3–5 discovery steps per episode</text>
  <text x="300" y="1116" text-anchor="middle" class="detailC" font-style="italic">new module (OpenSec had 5 fixed tables)</text>

  <rect x="530" y="1014" width="380" height="120" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="1040" text-anchor="middle" class="inner">Evidence Registry</text>
  <text x="720" y="1062" text-anchor="middle" class="detailC">typed EntitySupport from every result row:</text>
  <text x="720" y="1078" text-anchor="middle" class="detailC">account · ip · host · domain · file/hash · app · time</text>
  <text x="720" y="1094" text-anchor="middle" class="detailC">trust tier + scanner status + source table</text>
  <text x="720" y="1116" text-anchor="middle" class="detailC" font-style="italic">ranking logic reused unchanged</text>

  <rect x="950" y="1014" width="380" height="120" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="1140" y="1040" text-anchor="middle" class="inner">SQL Planner</text>
  <text x="1140" y="1062" text-anchor="middle" class="detailC">failed/emitted query memory · auto-repair</text>
  <text x="1140" y="1078" text-anchor="middle" class="detailC">SELECT-only + auto-LIMIT · targeted queries</text>
  <text x="1140" y="1094" text-anchor="middle" class="detailC">per entity · broad queries per answer gap</text>
  <text x="1140" y="1116" text-anchor="middle" class="detailC" font-style="italic">compact history fed to LLM prompts</text>

  <rect x="110" y="1154" width="380" height="120" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="1180" text-anchor="middle" class="inner">RAG Intel (1 call / episode)</text>
  <text x="300" y="1202" text-anchor="middle" class="detailC">ATT&amp;CK · Sigma · D3FEND · CWE corpus,</text>
  <text x="300" y="1218" text-anchor="middle" class="detailC">same Qdrant index &amp; retrievers as soc_defender</text>
  <text x="300" y="1234" text-anchor="middle" class="detailC">query cleaned: no SQL, no injection markers</text>
  <text x="300" y="1256" text-anchor="middle" class="detailC" font-style="italic">stack + sources reused verbatim</text>

  <rect x="530" y="1154" width="380" height="120" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="1180" text-anchor="middle" class="inner">Budget Phases</text>
  <text x="720" y="1202" text-anchor="middle" class="detailC">investigate_first → targeted_query → answer_fill</text>
  <text x="720" y="1218" text-anchor="middle" class="detailC">phase conditions investigator + verifier</text>
  <text x="720" y="1234" text-anchor="middle" class="detailC">forces best-effort submit before the deadline</text>
  <text x="720" y="1256" text-anchor="middle" class="detailC" font-style="italic">gated_containment phase renamed only</text>

  <rect x="950" y="1154" width="380" height="120" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="1140" y="1180" text-anchor="middle" class="inner">LLM Investigator</text>
  <text x="1140" y="1202" text-anchor="middle" class="detailC">sees compact state summary, not transcript:</text>
  <text x="1140" y="1218" text-anchor="middle" class="detailC">question slots · registry · query history · schema</text>
  <text x="1140" y="1234" text-anchor="middle" class="detailC">emits InvestigationIntent (JSON)</text>
  <text x="1140" y="1256" text-anchor="middle" class="detailC" font-style="italic">grounding: entity must be in known_entities</text>

  <line x1="720" y1="1308" x2="720" y2="1348" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- C. Verifier -->
  <rect x="80" y="1352" width="1280" height="210" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="720" y="1382" text-anchor="middle" class="blueTitle" font-size="17">C. Verifier (no environment step cost)</text>
  <text x="720" y="1402" text-anchor="middle" class="blueSub">the evidence gate — gate_containment generalized to gate_answer: same predicate chain, new gated commitment</text>

  <rect x="110" y="1422" width="380" height="110" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="300" y="1448" text-anchor="middle" class="inner">Answer Readiness Tracker</text>
  <text x="300" y="1470" text-anchor="middle" class="detailC">question parsed once into required slots</text>
  <text x="300" y="1486" text-anchor="middle" class="detailC">(which entity / attribute is asked)</text>
  <text x="300" y="1502" text-anchor="middle" class="detailC">slots filled from ranked registry supports</text>
  <text x="300" y="1522" text-anchor="middle" class="detailC" font-style="italic">ReportReadinessTracker analogue</text>

  <rect x="530" y="1422" width="380" height="110" rx="8" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="1448" text-anchor="middle" class="inner">Answer Gate (fail-closed)</text>
  <text x="720" y="1470" text-anchor="middle" class="detailC">every claimed entity: exactly observed ·</text>
  <text x="720" y="1486" text-anchor="middle" class="detailC">content-exposed · trusted source ·</text>
  <text x="720" y="1502" text-anchor="middle" class="detailC">not only inside flagged injection spans</text>
  <text x="720" y="1522" text-anchor="middle" class="detailC" font-style="italic">ungrounded claim → back to investigate</text>

  <rect x="950" y="1422" width="380" height="110" rx="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="1140" y="1448" text-anchor="middle" class="inner">Reward-Aware Submit</text>
  <text x="1140" y="1470" text-anchor="middle" class="detailC">expected slot gain vs step cost</text>
  <text x="1140" y="1486" text-anchor="middle" class="detailC">submit when marginal gain ≤ cost</text>
  <text x="1140" y="1502" text-anchor="middle" class="detailC">or deadline forces best-effort answer</text>
  <text x="1140" y="1522" text-anchor="middle" class="detailC" font-style="italic">report_decision analogue, retuned</text>

  <line x1="720" y1="1566" x2="720" y2="1606" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- D. Responder -->
  <rect x="80" y="1610" width="1280" height="90" rx="12" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
  <text x="720" y="1646" text-anchor="middle" class="darkTitle">D. Responder — deterministic arbitration</text>
  <text x="720" y="1672" text-anchor="middle" class="darkSub">only fires when the gate approves · converts intent to execute[SQL] or gated submit[answer] · emits exactly one benchmark action to ① Smart SOC Agent</text>

  <!-- mapping strip -->
  <rect x="80" y="1740" width="1280" height="190" rx="12" fill="#f5f9ff" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="104" y="1770" class="blueTitle" font-size="15">1:1 with soc_defender on OpenSec (same architecture, two instantiations)</text>
  <text x="110" y="1800" class="mapTxt">▪ gate_containment → gate_answer (identical predicate chain; gated commitment: containment → submitted answer)</text>
  <text x="110" y="1824" class="mapTxt">▪ ReportReadinessTracker → AnswerReadinessTracker (fixed report fields → question-derived answer slots)</text>
  <text x="110" y="1848" class="mapTxt">▪ fetch_email / fetch_alert → targeted query_logs on alert &amp; email tables (SecurityAlert, AlertEvidence, EmailEvents)</text>
  <text x="110" y="1872" class="mapTxt">▪ 5-table static allowlist → dynamic schema cache over 20+ tables · RAG corpus: IR playbooks → ATT&amp;CK + Sentinel table docs</text>
  <text x="110" y="1896" class="mapTxt">▪ unchanged: scanner stack · evidence registry &amp; trust ranking · SQL planner · budget · graph/state/traces · LLM boundary · episode summary</text>
</svg>
